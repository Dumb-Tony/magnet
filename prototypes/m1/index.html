</style></head><body>
<header><h1>MAGNET<span style="color:#edc66d">.</span></h1><small>WORKSHOP 01 / CORE VERB STUDY</small></header>
<main><div id="hud"><span>LOAD <b id="load">0.0</b> / 20</span><span id="field">○ FIELD OFF</span><span>PARTS <b id="capacity">0 / 40</b></span><span id="timer">0:00</span></div><canvas id="game" width="1120" height="680" aria-label="Top-down magnet workshop. Keyboard controls described below."></canvas><div id="hint" role="status">Move with WASD or arrows. Hold Space to gather metal.</div><div id="panel" class="overlay"><div class="card" id="card"></div></div><div id="debug" hidden></div></main>
<footer><button id="restart">Restart [R]</button><button id="pause">Pause [Esc]</button><label>Field <select id="control"><option value="hold">Hold</option><option value="toggle">Toggle</option></select></label><label><input type="checkbox" id="slow"> Slow practice</label><label><input type="checkbox" id="effects"> Reduced effects</label><label><input type="checkbox" id="contrast"> High contrast</label><button id="remap">Remap keys</button><button id="reset">Clear local data</button><span class="muted">F3: physics • Keyboard required</span></footer>
<script>
'use strict';
// All geometry, rendering and physics are embedded; no network or runtime dependencies.
const VERSION='m1-1', DT=1/120, W=1120,H=680,CAP=40,RADIUS=160;
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const defaults={up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',attract:'Space',repel:'ShiftLeft'};
let settings={control:'hold',slow:false,effects:false,contrast:false,keys:{...defaults}},records={};
let storageOK=true;try{let s=JSON.parse(localStorage.getItem('magnet.'+VERSION)||'null');if(s){settings={...settings,...s.settings,keys:{...defaults,...s.settings?.keys}};records=s.records||{}}}catch{storageOK=false}
function save(){try{localStorage.setItem('magnet.'+VERSION,JSON.stringify({settings,records}))}catch{storageOK=false}}
const v=(x=0,y=0)=>({x,y}),add=(a,b)=>v(a.x+b.x,a.y+b.y),sub=(a,b)=>v(a.x-b.x,a.y-b.y),mul=(a,k)=>v(a.x*k,a.y*k),dot=(a,b)=>a.x*b.x+a.y*b.y,cross=(a,b)=>a.x*b.y-a.y*b.x,len=a=>Math.hypot(a.x,a.y),rot=(a,t)=>v(a.x*Math.cos(t)-a.y*Math.sin(t),a.x*Math.sin(t)+a.y*Math.cos(t));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let bodies=[],player,walls=[],anchor,bay={x:900,y:220,w:185,h:245},nextId=0,state='start',elapsed=0,mode=0,ramp=0,keys=new Set(),toggleMode=0,delivered=new Set(),rests=new Map(),contacts=0,maxContacts=0,simCost=0,maxCost=0,acc=0,last=0,remapping=null,remapIndex=0,score=0,anchorSeen=false,shedCount=0,frameCost=0;
function shape(kind,m,w,h){return{id:nextId++,kind,m,w,h,p:v(),a:0}}
function body(x,y,s,angle=0,fixed=false){const b={p:v(x,y),a:angle,vel:v(),omega:0,parts:[s],fixed,cool:0};properties(b);return b}
function properties(b){b.mass=b.parts.reduce((t,s)=>t+s.m,0);b.inv=b.fixed?0:1/b.mass;b.inertia=b.parts.reduce((t,s)=>t+s.m*((s.w*s.w+s.h*s.h)/12+dot(s.p,s.p)),0);b.ii=b.fixed?0:1/b.inertia}
function world(b,s){return{...s,p:add(b.p,rot(s.p,b.a)),a:b.a+s.a,b}}
function core(){return world(player,player.parts.find(s=>s.kind==='core')).p}
function vertices(s){return [v(-s.w/2,-s.h/2),v(s.w/2,-s.h/2),v(s.w/2,s.h/2),v(-s.w/2,s.h/2)].map(p=>add(s.p,rot(p,s.a)))}
function velocity(b,p){const r=sub(p,b.p);return add(b.vel,v(-b.omega*r.y,b.omega*r.x))}
function impulse(b,j,p){if(b.fixed)return;b.vel=add(b.vel,mul(j,b.inv));b.omega+=cross(sub(p,b.p),j)*b.ii}
function force(b,f,p){impulse(b,mul(f,DT),p)}
function merge(a,b){let m=a.mass+b.mass,p=mul(add(mul(a.p,a.mass),mul(b.p,b.mass)),1/m),vel=mul(add(mul(a.vel,a.mass),mul(b.vel,b.mass)),1/m);let angular=a.inertia*a.omega+b.inertia*b.omega+cross(sub(a.p,p),mul(a.vel,a.mass))+cross(sub(b.p,p),mul(b.vel,b.mass));let parts=[...a.parts.map(s=>world(a,s)),...b.parts.map(s=>world(b,s))];a.p=p;a.vel=vel;a.parts=parts.map(s=>({...s,p:rot(sub(s.p,p),-a.a),a:s.a-a.a}));properties(a);a.omega=angular/a.inertia;bodies=bodies.filter(q=>q!==b)}
function shed(){if(player.parts.length===1)return;const old=player, cp=core();let pieces=old.parts.map(s=>{const w=world(old,s),b=body(w.p.x,w.p.y,{...s,p:v(),a:0},w.a);b.vel=velocity(old,w.p);b.omega=old.omega;b.cool=.65;return b});player=pieces.find(b=>b.parts[0].kind==='core');bodies=bodies.filter(b=>b!==old).concat(pieces);for(const b of pieces){if(b===player)continue;let d=sub(b.p,cp),n=mul(d,1/(len(d)||1)),j=mul(n,Math.min(30,b.mass*35));impulse(b,j,b.p);impulse(player,mul(j,-1),cp)}shedCount++}
function reset(play=true){nextId=0;bodies=[];walls=[];elapsed=0;mode=0;ramp=0;toggleMode=0;keys.clear();rests.clear();delivered.clear();score=0;anchorSeen=false;shedCount=0;acc=0;maxContacts=0;maxCost=0;
player=body(140,340,shape('core',5,28,28));bodies.push(player);
for(let i=0;i<24;i++){const s=shape(i%3===0?'nut':'bolt',1,i%3===0?14:10,i%3===0?14:18);bodies.push(body(225+(i%6)*28,270+Math.floor(i/6)*32,s,(i%3)*.35))}
bodies.push(body(365,435,shape('pipe',4,18,126),.1),body(315,175,shape('pipe',4,126,18),-.12),body(355,550,shape('block',20,62,62)));
const wall=(x,y,w,h)=>walls.push(body(x,y,shape('wall',1,w,h),0,true));wall(560,-12,1144,24);wall(560,692,1144,24);wall(-12,340,24,680);wall(1132,340,24,680);wall(560,178,50,356);wall(560,440,50,64);
anchor=body(795,145,shape('anchor',1000,106,38),0,true);walls.push(anchor);state=play?'play':'start';showPanel();}
function sat(a,b){const av=vertices(a),bv=vertices(b),axes=[rot(v(1,0),a.a),rot(v(0,1),a.a),rot(v(1,0),b.a),rot(v(0,1),b.a)];let depth=Infinity,n;
for(let axis of axes){let aa=av.map(p=>dot(p,axis)),bb=bv.map(p=>dot(p,axis)),over=Math.min(Math.max(...aa),Math.max(...bb))-Math.max(Math.min(...aa),Math.min(...bb));if(over<=0)return null;if(over<depth){depth=over;n=axis}}if(dot(sub(b.p,a.p),n)<0)n=mul(n,-1);
// Support-face midpoint avoids arbitrary corner torque on aligned boxes.
function support(vs,axis){let max=Math.max(...vs.map(p=>dot(p,axis)));let face=vs.filter(p=>max-dot(p,axis)<.01);return mul(face.reduce(add,v()),1/face.length)}
return{n,depth,p:mul(add(support(av,n),support(bv,mul(n,-1))),.5)}}
function candidates(){let grid=new Map(),pairs=[],seen=new Set();for(let b of [...bodies,...walls])for(let s of b.parts){let q=world(b,s),vs=vertices(q),xs=vs.map(p=>p.x),ys=vs.map(p=>p.y);for(let x=Math.floor(Math.min(...xs)/96);x<=Math.floor(Math.max(...xs)/96);x++)for(let y=Math.floor(Math.min(...ys)/96);y<=Math.floor(Math.max(...ys)/96);y++){let key=x+','+y,list=grid.get(key)||[];for(let other of list){if(other.b===b||(b.fixed&&other.b.fixed))continue;let id=[q.id,other.id].sort((a,b)=>a-b).join(':');if(!seen.has(id)){seen.add(id);pairs.push([q,other])}}list.push(q);grid.set(key,list)}}return pairs}
function collide(){contacts=0;let attach=new Set();for(let iteration=0;iteration<4;iteration++){for(let [sa,sb] of candidates()){let a=sa.b,b=sb.b,c=sat(sa,sb);if(!c)continue;contacts++;let rv=sub(velocity(b,c.p),velocity(a,c.p)),normalSpeed=dot(rv,c.n);
if(iteration===0&&mode===1&&(a===player||b===player)){let other=a===player?b:a;if(!other.fixed&&other.cool<=0&&len(rv)<90&&player.parts.length+other.parts.length<=CAP)attach.add(other)}
let inv=a.inv+b.inv;if(!inv)continue;let correction=mul(c.n,Math.max(0,c.depth-.05)*.65/inv);a.p=sub(a.p,mul(correction,a.inv));b.p=add(b.p,mul(correction,b.inv));if(normalSpeed>=0)continue;let ra=sub(c.p,a.p),rb=sub(c.p,b.p),den=inv+cross(ra,c.n)**2*a.ii+cross(rb,c.n)**2*b.ii;let j=clamp(-normalSpeed*1.05/den,0,180),J=mul(c.n,j);impulse(a,mul(J,-1),c.p);impulse(b,J,c.p);let tangent=v(-c.n.y,c.n.x),td=inv+cross(ra,tangent)**2*a.ii+cross(rb,tangent)**2*b.ii,jt=clamp(-dot(rv,tangent)/td,-j*.35,j*.35);impulse(a,mul(tangent,-jt),c.p);impulse(b,mul(tangent,jt),c.p)}}
for(let b of attach)if(bodies.includes(b)&&player.parts.length+b.parts.length<=CAP)merge(player,b);maxContacts=Math.max(maxContacts,contacts)}
function fieldForces(){const cp=core();for(let b of [...bodies,anchor]){if(b===player)continue;let delta=sub(b.p,cp),d=len(delta);if(d>=RADIUS||d<1)continue;let f=1400*(1-d/RADIUS)**2*(mode===1?ramp:-.8); // Same force on each side; heavier partner accelerates less.
let magnitude=Math.min(Math.abs(f),280*player.mass,280*b.mass)*Math.sign(f),F=mul(delta,magnitude/d);force(player,F,cp);if(!b.fixed)force(b,mul(F,-1),b.p);else if(mode===1&&magnitude>15)anchorSeen=true}}
function inside(s){return vertices(s).every(p=>p.x>=bay.x&&p.x<=bay.x+bay.w&&p.y>=bay.y&&p.y<=bay.y+bay.h)}
function deliveredMass(){return bodies.reduce((sum,b)=>sum+b.parts.reduce((t,s)=>t+(delivered.has(s.id)?s.m:0),0),0)}
function delivery(){const present=inside(world(player,player.parts.find(s=>s.kind==='core')));for(let b of bodies)for(let s of b.parts){if(s.kind==='core')continue;let w=world(b,s),resting=present&&inside(w)&&len(velocity(b,w.p))<10&&Math.abs(b.omega)<.12;let t=resting?(rests.get(s.id)||0)+DT:0;rests.set(s.id,t);if(t>=1)delivered.add(s.id);if(!inside(w))delivered.delete(s.id)}if(deliveredMass()>=20&&present){state='result';score=Math.floor(deliveredMass()*10);const k=settings.slow?'practice':'normal';let prev=records[k];if(!prev||elapsed<prev.time)records[k]={time:elapsed,mass:deliveredMass(),score};save();clearInput();showPanel()}}
function step(input=null){if(state!=='play')return;const t=performance.now();let next=input?input.mode:inputMode();if(next===-1&&mode!==-1)shed();mode=next;ramp=mode===1?Math.min(1,ramp+DT/.5):0;const previousVelocity=new Map(bodies.map(b=>[b,{...b.vel}]));let move=input?v(input.x,input.y):movement();if(len(move)>1)move=mul(move,1/len(move));force(player,mul(move,1450),core());if(mode)fieldForces();for(let b of bodies){const before=previousVelocity.get(b)||b.vel,change=sub(b.vel,before),changeLength=len(change);if(changeLength>360*DT)b.vel=add(before,mul(change,360*DT/changeLength));b.cool=Math.max(0,b.cool-DT);b.vel=mul(b.vel,Math.exp(-2.4*DT));b.omega*=Math.exp(-3*DT);const speed=len(b.vel);if(speed>240)b.vel=mul(b.vel,240/speed);b.omega=clamp(b.omega,-3,3);b.p=add(b.p,mul(b.vel,DT));b.a+=b.omega*DT}collide();elapsed+=DT;delivery();simCost=performance.now()-t;maxCost=Math.max(maxCost,simCost)}
function held(action){return keys.has(settings.keys[action])||(action==='repel'&&settings.keys.repel==='ShiftLeft'&&keys.has('ShiftRight'))}
function movement(){return v((held('right')||keys.has('ArrowRight')?1:0)-(held('left')||keys.has('ArrowLeft')?1:0),(held('down')||keys.has('ArrowDown')?1:0)-(held('up')||keys.has('ArrowUp')?1:0))}
function inputMode(){if(settings.control==='toggle')return toggleMode;return held('attract')===held('repel')?0:held('attract')?1:-1}
function clearInput(){keys.clear();toggleMode=0;mode=0;ramp=0;acc=0}
function pause(){if(state==='play'){state='paused';clearInput();showPanel()}else if(state==='paused'){state='play';clearInput();last=performance.now();showPanel()}}
function time(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function keyName(k){return k.replace('Key','').replace('Left','').replace('Arrow','')}
function showPanel(){ $('panel').hidden=state==='play';if(state==='play')return;let title=state==='start'?'Become the load.':state==='paused'?'Field on standby.':'Delivery accepted.';let text=state==='start'?'Gather metal. Feel its weight. Get 20 units into the striped delivery bay and hold still for one second. Every piece keeps its shape.':state==='paused'?'The workshop is paused. Resume when ready.':'You delivered '+deliveredMass().toFixed(1)+' mass in '+time(elapsed)+'. Score '+score+'. Try a different shape on your next run.';
$('card').innerHTML='<div class="eyebrow">MAGNET / '+(state==='result'?'LOAD VERIFIED':'ONE ROOM. REAL BAGGAGE.')+'</div><h2>'+title+'</h2><p>'+text+'</p><div class="controls"><kbd>'+keyName(settings.keys.up)+keyName(settings.keys.left)+keyName(settings.keys.down)+keyName(settings.keys.right)+'</kbd> / arrows · move<br><kbd>'+keyName(settings.keys.attract)+'</kbd> · attract &nbsp; <kbd>'+keyName(settings.keys.repel)+'</kbd> · shed / repel<br>Fixed anchor pulls you. Wide loads take the lower detour.</div><button class="primary" id="go">'+(state==='paused'?'Resume [Enter]':state==='result'?'Build another [Enter]':'Enter workshop [Enter]')+'</button><p class="muted">Untimed • 27 salvage pieces • Offline • '+(settings.slow?'Slow practice':'Normal physics')+'</p>';$('go').onclick=()=>state==='paused'?pause():reset();}
function drawShape(s){ctx.save();ctx.translate(s.p.x,s.p.y);ctx.rotate(s.a);const color={core:'#f1cc72',bolt:'#a2c1c2',nut:'#b8cccc',pipe:'#dc9874',block:'#839daa',anchor:'#79c8bf',wall:'#334951'};ctx.fillStyle=color[s.kind];ctx.strokeStyle=settings.contrast?'#fff':'#102027';ctx.lineWidth=2;ctx.fillRect(-s.w/2,-s.h/2,s.w,s.h);ctx.strokeRect(-s.w/2,-s.h/2,s.w,s.h);if(s.kind==='core'){ctx.fillStyle='#23383e';ctx.fillRect(-8,-8,5,14);ctx.fillRect(3,-8,5,14);ctx.fillRect(-8,3,16,5)}else if(s.kind==='nut'){ctx.strokeRect(-3,-3,6,6)}else if(s.kind==='pipe'){ctx.beginPath();ctx.moveTo(-s.w/2+4,-s.h/2+4);ctx.lineTo(s.w/2-4,s.h/2-4);ctx.strokeStyle='#f5c6a2';ctx.stroke()}else if(s.kind==='anchor'){ctx.fillStyle='#132e34';ctx.font='bold 12px Consolas';ctx.textAlign='center';ctx.fillText('⊗ FIXED ⊗',0,4)}else if(s.kind==='block'){ctx.strokeRect(-22,-22,44,44);ctx.fillStyle='#14252b';ctx.font='bold 18px Consolas';ctx.textAlign='center';ctx.fillText('20',0,7)}if(delivered.has(s.id)){ctx.strokeStyle='#b5f5b2';ctx.strokeRect(-s.w/2-3,-s.h/2-3,s.w+6,s.h+6)}ctx.restore()}
function label(text,x,y,color='#789699',size=12){ctx.fillStyle=color;ctx.font=size+'px Consolas';ctx.textAlign='left';ctx.fillText(text,x,y)}
function draw(){const start=performance.now();ctx.clearRect(0,0,W,H);ctx.strokeStyle='#243a40';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#27443e';ctx.fillRect(bay.x,bay.y,bay.w,bay.h);ctx.strokeStyle='#a8d1a0';ctx.setLineDash([10,8]);ctx.lineWidth=3;ctx.strokeRect(bay.x,bay.y,bay.w,bay.h);ctx.setLineDash([]);label('DELIVERY / 20',915,247,'#c5e0af',16);label('REST INSIDE · 1 SEC',915,270,'#a4c09f',12);label('01 / GATHER',65,90,'#c4c5aa',16);label('COMPACT SCRAP · 1 EACH',212,244);label('PIPE · 4',260,145,'#dc9874');label('HEAVY · 20',302,612);label('NARROW →',423,390,'#edc66d');label('WIDE DETOUR ↓',455,521,'#edc66d');label('→',650,584,'#edc66d',30);label('02 / PULL YOURSELF',693,85,'#79c8bf',16);label('Hold attract near the fixed steel.',677,110);label('03 / DELIVER',909,187,'#c5e0af',16);
if(mode){let cp=core();ctx.strokeStyle=mode===1?'#80d5d0':'#efa777';ctx.globalAlpha=settings.effects?.22:.45;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cp.x,cp.y,RADIUS,0,Math.PI*2);ctx.stroke();for(let i=0;i<12;i++){let angle=i*Math.PI/6,r=settings.effects?105:60+(elapsed*50%90)*(mode===1?-1:1)+(mode===1?90:0),p=add(cp,rot(v(r,0),angle));ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle+(mode===1?Math.PI:0));ctx.beginPath();ctx.moveTo(-7,-4);ctx.lineTo(0,0);ctx.lineTo(-7,4);ctx.stroke();ctx.restore()}ctx.globalAlpha=1}
for(let b of walls)for(let s of b.parts)drawShape(world(b,s));for(let b of bodies)for(let s of b.parts)drawShape(world(b,s));
if(!$('debug').hidden){ctx.fillStyle='#ff8fea';ctx.beginPath();ctx.arc(player.p.x,player.p.y,4,0,7);ctx.fill();$('debug').textContent=`${VERSION} | mass ${player.mass.toFixed(2)} | inertia ${player.inertia.toFixed(0)} | bodies ${bodies.length} | parts ${bodies.reduce((t,b)=>t+b.parts.length,0)}/${CAP} | contacts ${contacts} (peak ${maxContacts})\nsim ${simCost.toFixed(2)} ms (peak ${maxCost.toFixed(2)}) | frame ${frameCost.toFixed(2)} ms | anchor observed ${anchorSeen} | sheds ${shedCount} | storage ${storageOK?'OK':'memory only'}`}
$('load').textContent=(player.mass-5).toFixed(1);$('capacity').textContent=(player.parts.length-1)+' / '+(CAP-1);$('timer').textContent=time(elapsed);$('field').textContent=mode===1?'↓ ATTRACT '+Math.round(ramp*100)+'%':mode===-1?'↑ REPEL':held('attract')&&held('repel')?'○ BOTH HELD · OFF':'○ FIELD OFF';
let hint=player.parts.length>=CAP?'Capacity reached. Repel to make room.':mode===-1?'Repelling: all carried pieces released. Keep moving to leave the pile.':player.parts.some(s=>s.kind==='pipe')?'That pipe is part of your body. If it catches, hold '+keyName(settings.keys.repel)+' to shed it.':len(sub(core(),anchor.p))<RADIUS?'⊗ Fixed steel pulls YOU. Hold '+keyName(settings.keys.attract)+' and watch your core move toward it.':core().x>850?'Move the whole load inside. Release movement and field; rest for one second.':player.mass>=25?'Enough mass. Use the lower wide route, or shed for the narrow shortcut.':'Move and hold '+keyName(settings.keys.attract)+' to gather. The lower route has room for awkward loads.';if(!remapping)$('hint').textContent=hint;frameCost=performance.now()-start}
function frame(now){let delta=Math.min((now-last)/1000,8*DT);last=now;if(state==='play'){acc+=delta*(settings.slow?.5:1);let count=0;while(acc>=DT&&count<8){step();acc-=DT;count++}if(count===8)acc=0}draw();requestAnimationFrame(frame)}
